version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: { appnet: {} }

  # ---- Ray ----
  ray-head:
    build: ./ray/head
    restart: unless-stopped
    shm_size: 1gb
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      # Tell Ray Dashboard where Prometheus & Grafana are.
      RAY_PROMETHEUS_HOST: "http://prometheus:9090"
      RAY_GRAFANA_HOST: "http://grafana:3000"
      # This must be reachable by YOUR browser (we publish Grafana to localhost:3000).
      RAY_GRAFANA_IFRAME_HOST: "http://localhost:3000"
      RAY_PROMETHEUS_NAME: Prometheus
    command:
      [
        "bash","-lc",
        "ray start --head \
          --dashboard-host=0.0.0.0 \
          --port=6379 \
          --ray-client-server-port=10001 \
          --dashboard-port=8265 \
          --metrics-export-port=8080 \
          --temp-dir=/tmp/ray --block"
      ]
    ports: ["8265:8265","10001:10001"]
    healthcheck:
      test: ["CMD-SHELL","python -c \"import time,urllib.request; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8265/api/version').read(); print('ok')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      prometheus: { condition: service_started }
      grafana: { condition: service_started }
    networks: { appnet: {} }

  ray-worker:
    build: ./ray/worker
    restart: unless-stopped
    shm_size: 1gb
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      ray-head: { condition: service_healthy }
    command:
      [
        "bash","-lc",
        "ray start --address=ray-head:6379 --metrics-export-port=8080 --block"
      ]
    networks: { appnet: {} }

  llamaindex:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:devpass@postgres:5432/appdb
      RAY_ADDRESS: ray://ray-head:10001
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      ray-head: { condition: service_healthy }
    ports: ["8000:8000"]
    networks: { appnet: {} }

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle          # enables hot-reload /-/reload
    volumes:
      # Mount a DIRECTORY that contains prometheus.yml (and any rule files)
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    # (Optional) harden the container a bit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      appnet: {}


  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Let Ray embed Grafana in an <iframe> on the Dashboard:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      - prometheus
    networks: { appnet: {} }

networks:
  appnet: {}

volumes:
  pgdata: {}
  prom_data: {}
  grafana_data: {}
