global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: "local-dev"

scrape_configs:
  - job_name: ray-head
    static_configs:
      - targets: ["ray-head:8080"]  # Ray metrics export port

  - job_name: ray-workers
    static_configs:
      - targets:
          - "ray-worker:8080"

